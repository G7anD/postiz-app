---
# Builds the Nashrchi image (Postiz + our changes) for the avtomaktab server.
# The server pulls ghcr.io/g7and/postiz-app:nashrchi.
name: "Nashrchi image"

on:
  workflow_dispatch:
  push:
    branches:
      - nashrchi

permissions:
  contents: read
  packages: write

concurrency:
  group: nashrchi-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=v2.26.0-nashrchi
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/g7and/postiz-app:nashrchi
            ghcr.io/g7and/postiz-app:nashrchi-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
